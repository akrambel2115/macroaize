name: macroaize
description: "Track meals, calories, Workouts and more with MacroAize"
publish_to: 'none'

version: 1.0.0+13

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  shared_preferences: ^2.5.2
  carousel_slider: ^5.0.0
  intl: ^0.20.2
  camera: ^0.11.1
  image_cropper: ^9.0.0
  image_picker: ^1.1.2
  image: ^4.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  http: ^1.3.0
  sqflite: ^2.4.2
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29
  syncfusion_flutter_charts: ^29.1.35
  fluttertoast: ^8.2.12
  in_app_purchase: ^3.2.1
  purchases_flutter: ^8.0.0
  dart_openai: ^5.1.0
  lottie: ^3.3.1
  speech_to_text: ^7.0.0
  visibility_detector: ^0.4.0+2
  flutter_dotenv: ^5.1.0
  share_plus: ^10.1.4
  screenshot: ^3.0.0

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.3
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.4
  firebase_messaging: ^15.1.3
  package_info_plus: ^8.0.2
  home_widget: ^0.7.0
  in_app_review: ^2.0.9
  google_mlkit_barcode_scanning: ^0.13.0
  rxdart: ^0.28.0
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  firebase_remote_config: ^5.5.0
  vector_math: ^2.2.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  drift_dev: ^2.23.1
  csv: ^6.0.0
  sqlite3: ^2.7.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/macroaize_ps.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/database/local_food.db
    - lib/constant/foodLibrary.json
    - lib/constant/recipeLibrary.json
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: PoppinsSemiBold
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
    - family: NotoSansArabicSemiBold
      fonts:
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
