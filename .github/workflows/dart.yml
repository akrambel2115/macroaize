name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-13   # explicitly pin macOS version (Xcode 14.x is stable)
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      # Update CocoaPods repo
      - run: pod repo update
        working-directory: ios

      # Build IPA instead of raw iOS build
      - run: flutter build ipa --release --no-codesign

      # Rename IPA for release
      - name: Rename IPA
        run: mv build/ios/ipa/*.ipa build/ios/ipa/FoodCalorieTracker.ipa

      # Upload IPA to GitHub release
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/ipa/FoodCalorieTracker.ipa
          tag: v1.0
          overwrite: true
          body: "This is the first release"
