name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      - run: flutter pub get

      # 🔥 CRITICAL: Force iOS 15.0 in Podfile and Xcode project
      - name: Set iOS 15.0 Deployment Target
        run: |
          echo "🔧 Forcing iOS 15.0 in Podfile..."
          # Ensure platform is set to 15.0
          sed -i '' 's/platform :ios, .*/platform :ios, '\''15.0'\''/' ios/Podfile

          echo "🔧 Forcing iOS 15.0 in Xcode project..."
          # Update deployment target in pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

          # Also ensure Swift version is set
          sed -i '' 's/SWIFT_VERSION = [0-9.]*;/SWIFT_VERSION = 5.9;/g' ios/Runner.xcodeproj/project.pbxproj || echo "SWIFT_VERSION already set"

          # Verify
          echo "✅ Podfile:"
          grep "platform :ios" ios/Podfile
          echo "✅ IPHONEOS_DEPLOYMENT_TARGET:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj | head -n 2
          echo "✅ SWIFT_VERSION:"
          grep "SWIFT_VERSION" ios/Runner.xcodeproj/project.pbxproj | head -n 1

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update
        env:
          FLUTTER_ROOT: ${{ github.workspace }}

      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign --build-name=1.0.0 --build-number=1
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Runner.ipa Payload
          mkdir -p ../ipa
          mv Runner.ipa ../ipa/

      - name: Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0
          files: build/ipa/Runner.ipa
          body: "Unsigned IPA with iOS 15.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
