name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      - run: flutter pub get

      # 👉 CRITICAL FIX: Update iOS deployment target to 15.0
      - name: Update iOS Deployment Target
        run: |
          # Update Podfile
          sed -i '' 's/platform :ios, .*/platform :ios, "15.0"/' ios/Podfile
          
          # Update Xcode project
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj

      - run: pod install --repo-update
        working-directory: ios

      # Direct IPA export approach for unsigned build
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload
          zip -r app.ipa Payload
          mkdir -p ../ipa
          mv app.ipa ../ipa/Runner.ipa

      - name: Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0
          files: build/ipa/Runner.ipa
          body: "First unsigned IPA release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
