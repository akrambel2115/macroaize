name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      - run: flutter pub get

      - run: pod install --repo-update
        working-directory: ios

      # Direct IPA export approach for unsigned build
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload
          zip -r app.ipa Payload
          ls -la app.ipa
          mkdir -p ../ipa
          mv app.ipa ../ipa/Runner.ipa

      - name: Verify IPA
        run: |
          find build -name "*.ipa" -exec ls -la {} \;
          find build -name "*.ipa" -exec file {} \;

      - name: Find IPA
        id: find_ipa
        run: |
          ipa=$(find build -type f -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ] || [ ! -s "$ipa" ]; then
            echo "No valid IPA found"
            exit 1
          fi
          echo "Found IPA: $ipa ($(du -h $ipa | cut -f1))"
          echo "path=$ipa" >> $GITHUB_OUTPUT

      - name: Upload IPA
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.find_ipa.outputs.path }}
          tag: v2.0
          overwrite: true
          body: "This is first release"
