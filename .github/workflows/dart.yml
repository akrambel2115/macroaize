name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      # ✅ Step 1: Update iOS Deployment Target to 15.0
      - name: Set iOS 15.0 Deployment Target
        run: |
          # 1. Update Podfile
          echo "Updating Podfile to iOS 15.0..."
          sed -i '' 's/platform :ios, .*/platform :ios, '\''15.0'\''/' ios/Podfile

          # 2. Update Xcode project (project.pbxproj)
          echo "Updating Xcode project file..."
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]+(\.[0-9]+)*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj

          # 3. Verify changes
          echo "✅ Podfile updated:"
          grep "platform :ios" ios/Podfile
          echo "✅ Xcode project updated:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj | head -n 1

      - run: flutter pub get

      - run: |
          cd ios
          pod install --repo-update
        env:
          FLUTTER_ROOT: ${{ github.workspace }}

      # Build unsigned IPA
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign --build-name=1.0.0 --build-number=1
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Runner.ipa Payload
          mkdir -p ../ipa
          mv Runner.ipa ../ipa/

      - name: Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0
          files: build/ipa/Runner.ipa
          body: "Unsigned IPA build with iOS 15.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
