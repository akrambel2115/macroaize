org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
KOTLIN_DAEMON_JVM_OPTIONS=-Xmx1024m
android.useAndroidX=true
android.enableJetifier=false
# Reduce Windows file-lock issues from Kotlin incremental caches
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
